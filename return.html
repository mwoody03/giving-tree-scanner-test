<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Giving Tree Returns</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

.card {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 18px;
}

h1 {
  text-align: center;
  font-size: 30px;
  margin: 4px 0 8px;
}

.subtitle {
  text-align: center;
  margin-top: 0;
  font-size: 18px;
}

button {
  width: 100%;
  min-height: 58px;
  padding: 14px;
  margin-top: 12px;
  font-size: 20px;
  font-weight: bold;
  border-radius: 10px;
  border: 1px solid #aaa;
  background: white;
  cursor: pointer;
}

.scanner-box {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border: 2px solid #ccc;
  border-radius: 12px;
  background: #fafafa;
}

.scanner-box.active {
  display: block;
}

.scan-title {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 4px 0 10px;
}

.scan-frame {
  position: relative;
}

video {
  width: 100%;
  min-height: 260px;
  max-height: 430px;
  object-fit: cover;
  background: black;
  border-radius: 10px;
}

.scan-guide {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 68%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  border-radius: 12px;
  pointer-events: none;
}

.scan-flash {
  position: fixed;
  inset: 0;
  background: rgba(85,190,90,.28);
  opacity: 0;
  pointer-events: none;
  z-index: 9998;
}

.scan-flash.active {
  animation: flashScreen .45s ease-out;
}

@keyframes flashScreen {
  0% { opacity: 0; }
  25% { opacity: 1; }
  100% { opacity: 0; }
}

.scan-banner {
  display: none;
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 580px;
  padding: 22px 16px;
  background: #eef8ee;
  border: 3px solid #777;
  border-radius: 14px;
  text-align: center;
  z-index: 9999;
  box-shadow: 0 6px 22px rgba(0,0,0,.22);
}

.scan-banner.active {
  display: block;
}

.scan-banner-main {
  display: block;
  font-size: 28px;
  font-weight: bold;
}

.scan-banner-next {
  display: block;
  margin-top: 6px;
  font-size: 20px;
  font-weight: bold;
}

#status {
  margin-top: 14px;
  padding: 14px;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  border-radius: 9px;
  background: #f0f0f0;
  line-height: 1.35;
}

.status-ready {
  background: #eef8ee !important;
}

.status-saving {
  background: #fff8df !important;
}

.status-error {
  background: #fdecec !important;
}

.counter-box {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.counter {
  flex: 1;
  text-align: center;
  padding: 10px 4px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: #fafafa;
}

.counter-number {
  display: block;
  font-size: 25px;
  font-weight: bold;
}

.counter-label {
  display: block;
  margin-top: 3px;
  font-size: 14px;
}

.manual-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 2px solid #ddd;
}

.manual-row {
  display: flex;
  gap: 8px;
}

.manual-row input {
  flex: 1;
  min-width: 0;
  min-height: 56px;
  padding: 12px;
  font-size: 21px;
  border: 1px solid #aaa;
  border-radius: 9px;
}

.manual-row button {
  width: auto;
  min-width: 135px;
  margin-top: 0;
}

.queue-section {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 2px solid #ddd;
}

.queue-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 8px;
  border-bottom: 1px solid #ddd;
  font-size: 18px;
}

.queue-angel {
  font-weight: bold;
}

.queue-result {
  text-align: right;
  font-weight: bold;
}

@media (max-width: 480px) {
  .manual-row {
    flex-direction: column;
  }

  .manual-row button {
    width: 100%;
  }
}

</style>

</head>

<body>

<div id="scanFlash" class="scan-flash"></div>

<div id="scanBanner" class="scan-banner">

<span
  id="scanBannerMain"
  class="scan-banner-main">
✓ SCANNED
</span>

<span class="scan-banner-next">
NEXT GIFT
</span>

</div>


<div class="card">

<h1>Giving Tree Returns</h1>

<p class="subtitle">
Continuous Gift Check In
</p>


<button id="startButton">
Start Return Scanner
</button>


<div
  id="scannerBox"
  class="scanner-box">

<div class="scan-title">
Keep scanning. Returns save automatically.
</div>

<div class="scan-frame">

<video
  id="qrVideo"
  playsinline>
</video>

<div class="scan-guide"></div>

</div>

<button id="stopButton">
Stop Scanner
</button>

</div>


<div
  id="status"
  class="status-ready">
Ready to begin.
</div>


<div class="counter-box">

<div class="counter">
<span id="savedCount" class="counter-number">0</span>
<span class="counter-label">Saved</span>
</div>

<div class="counter">
<span id="pendingCount" class="counter-number">0</span>
<span class="counter-label">In Queue</span>
</div>

<div class="counter">
<span id="problemCount" class="counter-number">0</span>
<span class="counter-label">Attention</span>
</div>

</div>


<div class="manual-section">

<h2>Manual Check In</h2>

<p>
For a missing or damaged QR tag, enter the Angel number.
</p>

<div class="manual-row">

<input
  id="manualAngel"
  type="text"
  inputmode="numeric"
  placeholder="Example: 777"
>

<button id="manualButton">
Check In
</button>

</div>

</div>


<div class="queue-section">

<h2>Recent Returns</h2>

<div id="queueList">
No gifts scanned yet.
</div>

</div>

</div>


<script type="module">

import QrScanner
from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


const API_URL =
"https://script.google.com/macros/s/AKfycbxZp0fNOC7QPDzvOrWCezJl8jKH0ZrSHGnmnEfnnuu44Sr8HrN9NFa-EZlz4GRrQVOF/exec";


const BATCH_SIZE = 5;

const BATCH_DELAY = 1500;

const STORAGE_KEY =
"givingTreeReturnQueueV1";


const video =
document.getElementById("qrVideo");

const scannerBox =
document.getElementById("scannerBox");

const startButton =
document.getElementById("startButton");

const stopButton =
document.getElementById("stopButton");

const status =
document.getElementById("status");

const manualAngel =
document.getElementById("manualAngel");

const manualButton =
document.getElementById("manualButton");

const queueList =
document.getElementById("queueList");

const savedCount =
document.getElementById("savedCount");

const pendingCount =
document.getElementById("pendingCount");

const problemCount =
document.getElementById("problemCount");

const scanBanner =
document.getElementById("scanBanner");

const scanBannerMain =
document.getElementById("scanBannerMain");

const scanFlash =
document.getElementById("scanFlash");


let returnQueue = [];

let batchTimer = null;

let batchRunning = false;

let lastScannedAngel = "";

let lastScanTime = 0;

let bannerTimer = null;



function normalizeAngel(value) {

  const digits =
  String(value || "")
    .replace(/\D/g, "");


  if (!digits) {
    return "";
  }


  return "Angel" +
  digits.padStart(
    3,
    "0"
  );

}



function extractAngelCode(scannedText) {

  try {

    const url =
    new URL(scannedText);


    for (
      const value
      of url.searchParams.values()
    ) {

      if (
        /^Angel\d+$/i.test(
          value
        )
      ) {

        return normalizeAngel(
          value
        );

      }

    }

  }

  catch (error) {

    if (
      /^Angel\d+$/i.test(
        String(scannedText || "")
      )
    ) {

      return normalizeAngel(
        scannedText
      );

    }

  }


  return "";

}



function createId() {

  return (
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2)
  );

}



function createToken() {

  return (
    "batch_" +
    createId()
  );

}



function saveLocalQueue() {

  const keep =
  returnQueue.filter(
    function(item) {

      return (
        item.state === "queued" ||
        item.state === "sending"
      );

    }
  );


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(keep)
  );

}



function restoreLocalQueue() {

  try {

    const stored =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );


    if (
      !Array.isArray(stored)
    ) {

      return;

    }


    stored.forEach(
      function(item) {

        /*
        If the browser closed during a send,
        we cannot safely assume success or failure.

        Put it back in the queue.
        The backend's duplicate protection
        will protect the database if it had
        already been saved.
        */

        item.state =
        "queued";


        item.message =
        "Recovered";


        returnQueue.push(
          item
        );

      }
    );

  }

  catch (error) {

  }

}



function showScanConfirmation(
  angel
) {

  scanBannerMain.textContent =
  "✓ " +
  angel +
  " SCANNED";


  scanBanner.classList.add(
    "active"
  );


  scanFlash.classList.remove(
    "active"
  );


  void scanFlash.offsetWidth;


  scanFlash.classList.add(
    "active"
  );


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      100
    );

  }


  if (
    bannerTimer
  ) {

    clearTimeout(
      bannerTimer
    );

  }


  bannerTimer =
  setTimeout(
    function() {

      scanBanner.classList.remove(
        "active"
      );

    },
    1000
  );

}



function updateCounters() {

  const saved =
  returnQueue.filter(
    item =>
    item.state === "saved"
  ).length;


  const pending =
  returnQueue.filter(
    item =>
    (
      item.state === "queued" ||
      item.state === "sending"
    )
  ).length;


  const problems =
  returnQueue.filter(
    item =>
    item.state === "problem"
  ).length;


  savedCount.textContent =
  saved;


  pendingCount.textContent =
  pending;


  problemCount.textContent =
  problems;

}



function displayQueue() {

  queueList.innerHTML =
  "";


  if (
    returnQueue.length === 0
  ) {

    queueList.textContent =
    "No gifts scanned yet.";

    updateCounters();

    return;

  }


  returnQueue
    .slice()
    .reverse()
    .slice(
      0,
      15
    )
    .forEach(
      function(item) {

        const row =
        document.createElement(
          "div"
        );


        row.className =
        "queue-item";


        const angel =
        document.createElement(
          "div"
        );


        angel.className =
        "queue-angel";


        angel.textContent =
        item.angel;


        const result =
        document.createElement(
          "div"
        );


        result.className =
        "queue-result";


        if (
          item.state === "queued"
        ) {

          result.textContent =
          "Queued";

        }


        else if (
          item.state === "sending"
        ) {

          result.textContent =
          "Saving...";

        }


        else if (
          item.state === "saved"
        ) {

          result.textContent =
          "✓ Saved";

        }


        else {

          result.textContent =
          "⚠ " +
          item.message;

        }


        row.appendChild(
          angel
        );


        row.appendChild(
          result
        );


        queueList.appendChild(
          row
        );

      }
    );


  updateCounters();

}



function setStatus(
  message,
  type
) {

  status.textContent =
  message;


  status.className =
  "";


  if (
    type === "ready"
  ) {

    status.classList.add(
      "status-ready"
    );

  }


  else if (
    type === "saving"
  ) {

    status.classList.add(
      "status-saving"
    );

  }


  else if (
    type === "error"
  ) {

    status.classList.add(
      "status-error"
    );

  }

}



function jsonpOnce(
  action,
  values
) {

  return new Promise(
    function(resolve, reject) {

      const callback =
      "gtr_" +
      createId();


      const script =
      document.createElement(
        "script"
      );


      const timeout =
      setTimeout(
        function() {

          cleanup();


          reject(
            new Error(
              "Confirmation timed out."
            )
          );

        },
        15000
      );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.remove();

        }


        try {

          delete window[
            callback
          ];

        }

        catch (error) {

        }

      }


      window[
        callback
      ] =
      function(result) {

        cleanup();

        resolve(
          result
        );

      };


      script.onerror =
      function() {

        cleanup();


        reject(
          new Error(
            "Database connection failed."
          )
        );

      };


      const params =
      new URLSearchParams();


      params.set(
        "mode",
        "api"
      );


      params.set(
        "action",
        action
      );


      Object.keys(
        values
      ).forEach(
        function(key) {

          params.set(
            key,
            values[key]
          );

        }
      );


      params.set(
        "callback",
        callback
      );


      script.src =
      API_URL +
      "?" +
      params.toString();


      document.body.appendChild(
        script
      );

    }
  );

}



function postBatch(
  angels,
  token
) {

  const iframeName =
  "returnBatchFrame_" +
  createId();


  const iframe =
  document.createElement(
    "iframe"
  );


  iframe.name =
  iframeName;


  iframe.style.display =
  "none";


  document.body.appendChild(
    iframe
  );


  const form =
  document.createElement(
    "form"
  );


  form.method =
  "POST";


  form.action =
  API_URL;


  form.target =
  iframeName;


  form.style.display =
  "none";


  const fields = {

    type:
    "returnBatch",

    token:
    token,

    angels:
    JSON.stringify(
      angels
    )

  };


  Object.keys(
    fields
  ).forEach(
    function(key) {

      const input =
      document.createElement(
        "input"
      );


      input.type =
      "hidden";


      input.name =
      key;


      input.value =
      fields[key];


      form.appendChild(
        input
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  setTimeout(
    function() {

      form.remove();

    },
    2000
  );


  setTimeout(
    function() {

      iframe.remove();

    },
    90000
  );

}



async function waitForBatch(
  token
) {

  const start =
  Date.now();


  while (
    Date.now() -
    start <
    90000
  ) {

    try {

      const result =
      await jsonpOnce(
        "returnStatus",
        {
          token: token
        }
      );


      if (
        result.done
      ) {

        return result;

      }

    }

    catch (error) {

    }


    await new Promise(
      resolve =>
      setTimeout(
        resolve,
        750
      )
    );

  }


  throw new Error(
    "Confirmation delayed"
  );

}



function scheduleBatch() {

  if (
    batchRunning
  ) {

    return;

  }


  const queued =
  returnQueue.filter(
    item =>
    item.state === "queued"
  );


  if (
    queued.length >=
    BATCH_SIZE
  ) {

    if (
      batchTimer
    ) {

      clearTimeout(
        batchTimer
      );


      batchTimer =
      null;

    }


    sendNextBatch();

    return;

  }


  if (
    queued.length > 0 &&
    !batchTimer
  ) {

    batchTimer =
    setTimeout(
      function() {

        batchTimer =
        null;


        sendNextBatch();

      },
      BATCH_DELAY
    );

  }

}



async function sendNextBatch() {

  if (
    batchRunning
  ) {

    return;

  }


  const batchItems =
  returnQueue
    .filter(
      item =>
      item.state === "queued"
    )
    .slice(
      0,
      BATCH_SIZE
    );


  if (
    batchItems.length === 0
  ) {

    return;

  }


  batchRunning =
  true;


  const token =
  createToken();


  batchItems.forEach(
    function(item) {

      item.state =
      "sending";


      item.batchToken =
      token;

    }
  );


  saveLocalQueue();

  displayQueue();


  const angels =
  batchItems.map(
    item =>
    item.angel
  );


  postBatch(
    angels,
    token
  );


  try {

    const response =
    await waitForBatch(
      token
    );


    if (
      !response.success ||
      !Array.isArray(
        response.results
      )
    ) {

      throw new Error(
        response.message ||
        "Batch failed"
      );

    }


    response.results.forEach(
      function(result, index) {

        const item =
        batchItems[index];


        if (!item) {
          return;
        }


        if (
          result.success
        ) {

          item.state =
          "saved";


          item.message =
          "Saved";

        }

        else {

          item.state =
          "problem";


          item.message =
          result.duplicate
            ? "Already Returned"
            : (
                result.message ||
                "Needs Attention"
              );

        }

      }
    );

  }

  catch (error) {

    /*
    IMPORTANT:
    Do not automatically resend a batch
    after an uncertain confirmation.

    Google may already have processed it.
    */

    batchItems.forEach(
      function(item) {

        item.state =
        "problem";


        item.message =
        "Check Return Log";

      }
    );


    setStatus(
      "A batch needs attention. Scanning can continue.",
      "error"
    );

  }


  batchRunning =
  false;


  saveLocalQueue();

  displayQueue();


  scheduleBatch();

}



function queueReturn(
  angel
) {

  if (!angel) {

    setStatus(
      "Invalid Giving Tree Angel.",
      "error"
    );


    return;

  }


  const alreadyPending =
  returnQueue.some(
    function(item) {

      return (
        item.angel === angel &&
        (
          item.state === "queued" ||
          item.state === "sending"
        )
      );

    }
  );


  if (
    alreadyPending
  ) {

    showScanConfirmation(
      angel
    );


    setStatus(
      angel +
      " is already waiting to save.",
      "saving"
    );


    return;

  }


  const item = {

    id:
    createId(),

    angel:
    angel,

    state:
    "queued",

    message:
    "Queued",

    createdAt:
    Date.now()

  };


  returnQueue.push(
    item
  );


  saveLocalQueue();

  displayQueue();


  showScanConfirmation(
    angel
  );


  setStatus(
    angel +
    " captured. NEXT GIFT.",
    "ready"
  );


  scheduleBatch();

}



const scanner =
new QrScanner(

  video,

  function(result) {

    const angel =
    extractAngelCode(
      result.data
    );


    if (!angel) {

      setStatus(
        "Invalid QR. Keep scanning.",
        "error"
      );


      return;

    }


    const now =
    Date.now();


    if (
      angel ===
      lastScannedAngel &&
      now -
      lastScanTime <
      6000
    ) {

      return;

    }


    lastScannedAngel =
    angel;


    lastScanTime =
    now;


    queueReturn(
      angel
    );

  },


  {

    preferredCamera:
    "environment",

    highlightScanRegion:
    true,

    highlightCodeOutline:
    true,

    returnDetailedScanResult:
    true

  }

);



startButton.onclick =
async function() {

  scannerBox.classList.add(
    "active"
  );


  setStatus(
    "Starting camera...",
    "saving"
  );


  try {

    await scanner.start();


    startButton.style.display =
    "none";


    setStatus(
      "Scanner ready. Scan the first gift.",
      "ready"
    );

  }

  catch (error) {

    scannerBox.classList.remove(
      "active"
    );


    setStatus(
      "Camera could not start.",
      "error"
    );

  }

};



stopButton.onclick =
async function() {

  try {

    await scanner.stop();

  }

  catch (error) {

  }


  scannerBox.classList.remove(
    "active"
  );


  startButton.style.display =
  "block";


  setStatus(
    "Scanner stopped. Pending returns will continue saving.",
    "ready"
  );

};



manualButton.onclick =
function() {

  const angel =
  normalizeAngel(
    manualAngel.value
  );


  if (!angel) {

    setStatus(
      "Please enter a valid Angel number.",
      "error"
    );


    return;

  }


  manualAngel.value =
  "";


  queueReturn(
    angel
  );


  manualAngel.focus();

};



manualAngel.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();


      manualButton.click();

    }

  }
);



restoreLocalQueue();

displayQueue();

scheduleBatch();


</script>

</body>

</html>
