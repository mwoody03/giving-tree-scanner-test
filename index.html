<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Giving Tree</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-top: 0;
    }

    h2 {
      font-size: 22px;
      margin-top: 24px;
    }

    p {
      font-size: 18px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 14px;
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      border: 1px solid #aaa;
      background: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .scanner-box {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 12px;
      background: #fafafa;
    }

    .scanner-box.active {
      display: block;
    }

    .scanner-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .scan-frame {
      position: relative;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 10px;
      background: #000;
      min-height: 260px;
      object-fit: cover;
    }

    .scan-guide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
    }

    .cancel-button {
      min-height: 48px;
      font-size: 17px;
    }

    .angel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    .remove-button {
      width: auto;
      min-height: 40px;
      margin: 0;
      padding: 8px 12px;
      font-size: 15px;
    }

    .claim-form {
      display: none;
      margin-top: 24px;
      padding-top: 22px;
      border-top: 2px solid #ddd;
    }

    label {
      display: block;
      margin-top: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 14px;
      margin-top: 7px;
      font-size: 18px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    .review-item {
      font-size: 19px;
      padding: 8px 0;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      border-radius: 8px;
      background: #f0f0f0;
      line-height: 1.4;
    }

    .success {
      background: #eef8ee !important;
    }

    .error {
      background: #fdecec !important;
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-screen h2 {
      font-size: 28px;
    }
  </style>
</head>

<body>

<div class="card">

  <div id="mainScreen">

    <h1>Giving Tree</h1>

    <p>
      Scan each Angel you would like to sponsor.
    </p>

    <button id="scanButton">
      Scan Angel
    </button>

    <div id="scannerBox" class="scanner-box">

      <div class="scanner-title">
        Point the camera at the Angel QR code
      </div>

      <div class="scan-frame">

        <video
          id="qrVideo"
          playsinline>
        </video>

        <div class="scan-guide"></div>

      </div>

      <button
        id="cancelScanButton"
        class="cancel-button">
        Cancel Scan
      </button>

    </div>

    <div id="status">
      Ready to scan.
    </div>

    <h2>Your Angels</h2>

    <div id="angelList"></div>

    <button id="completeButton">
      Complete Claim
    </button>

    <div id="claimForm" class="claim-form">

      <h2>Sponsor Information</h2>

      <label for="sponsorName">
        Full Name
      </label>

      <input
        type="text"
        id="sponsorName"
        autocomplete="name"
      >

      <label for="sponsorEmail">
        Email Address
      </label>

      <input
        type="email"
        id="sponsorEmail"
        autocomplete="email"
      >

      <label for="sponsorPhone">
        Phone Number
      </label>

      <input
        type="tel"
        id="sponsorPhone"
        autocomplete="tel"
      >

      <h2>Review Your Angels</h2>

      <div id="reviewList"></div>

      <button id="submitClaimButton">
        Claim My Angels
      </button>

    </div>

  </div>


  <div
    id="successScreen"
    class="success-screen">

    <h2>Claim Complete</h2>

    <p id="successMessage"></p>

    <p>
      Thank you for supporting the Giving Tree.
    </p>

    <button id="startOverButton">
      Start New Claim
    </button>

  </div>

</div>


<script type="module">

  import QrScanner
    from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const API_URL =
    "https://script.google.com/macros/s/AKfycbxZp0fNOC7QPDzvOrWCezJl8jKH0ZrSHGnmnEfnnuu44Sr8HrN9NFa-EZlz4GRrQVOF/exec";


  const video =
    document.getElementById("qrVideo");

  const status =
    document.getElementById("status");

  const scanButton =
    document.getElementById("scanButton");

  const cancelScanButton =
    document.getElementById("cancelScanButton");

  const scannerBox =
    document.getElementById("scannerBox");

  const completeButton =
    document.getElementById("completeButton");

  const submitClaimButton =
    document.getElementById("submitClaimButton");

  const claimForm =
    document.getElementById("claimForm");

  const angelList =
    document.getElementById("angelList");

  const reviewList =
    document.getElementById("reviewList");

  const mainScreen =
    document.getElementById("mainScreen");

  const successScreen =
    document.getElementById("successScreen");

  const successMessage =
    document.getElementById("successMessage");

  const startOverButton =
    document.getElementById("startOverButton");


  let angels =
    JSON.parse(
      localStorage.getItem("givingTreeCart") || "[]"
    );


  let scanBeingProcessed =
    false;


  function saveCart() {

    localStorage.setItem(
      "givingTreeCart",
      JSON.stringify(angels)
    );

  }


  function clearCart() {

    localStorage.removeItem(
      "givingTreeCart"
    );

    angels = [];

  }


  function extractAngelCode(scannedText) {

    try {

      const url =
        new URL(scannedText);

      const params =
        new URLSearchParams(
          url.search
        );


      for (
        const value
        of params.values()
      ) {

        if (
          /^Angel\d+$/i.test(value)
        ) {

          const digits =
            value.replace(/\D/g, "");

          return "Angel" +
            digits.padStart(3, "0");

        }

      }

    }

    catch (error) {

      if (
        /^Angel\d+$/i.test(
          scannedText
        )
      ) {

        const digits =
          scannedText.replace(/\D/g, "");

        return "Angel" +
          digits.padStart(3, "0");

      }

    }


    return "";

  }


  function displayCart() {

    angelList.innerHTML = "";


    if (
      angels.length === 0
    ) {

      angelList.innerHTML =
        "<p>No Angels selected yet.</p>";

      return;

    }


    angels.forEach(
      function(angel) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "angel-row";


        const label =
          document.createElement(
            "span"
          );

        label.textContent =
          "✓ " + angel;


        const removeButton =
          document.createElement(
            "button"
          );

        removeButton.textContent =
          "Remove";

        removeButton.className =
          "remove-button";


        removeButton.addEventListener(
          "click",
          function() {

            angels =
              angels.filter(
                function(item) {

                  return item !== angel;

                }
              );


            saveCart();

            displayCart();

            displayReview();


            status.textContent =
              angel +
              " removed from your list.";

            status.className = "";

          }
        );


        row.appendChild(
          label
        );

        row.appendChild(
          removeButton
        );

        angelList.appendChild(
          row
        );

      }
    );

  }


  function displayReview() {

    reviewList.innerHTML = "";


    angels.forEach(
      function(angel) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "review-item";

        item.textContent =
          "✓ " + angel;

        reviewList.appendChild(
          item
        );

      }
    );

  }


  /*
  =========================================
  ORIGINAL WORKING AVAILABILITY CHECK
  =========================================
  */

  function checkAvailability(
    angel
  ) {

    return new Promise(
      function(resolve, reject) {

        const callbackName =
          "givingTreeCallback_" +
          Date.now() +
          "_" +
          Math.floor(
            Math.random() * 100000
          );


        const script =
          document.createElement(
            "script"
          );


        const timeout =
          setTimeout(
            function() {

              cleanup();

              reject(
                new Error(
                  "The availability check timed out."
                )
              );

            },
            10000
          );


        function cleanup() {

          clearTimeout(
            timeout
          );


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          try {

            delete window[
              callbackName
            ];

          }

          catch (error) {

            window[
              callbackName
            ] = undefined;

          }

        }


        window[
          callbackName
        ] =
          function(result) {

            cleanup();

            resolve(
              result
            );

          };


        script.onerror =
          function() {

            cleanup();

            reject(
              new Error(
                "Unable to contact the Giving Tree database."
              )
            );

          };


        script.src =
          API_URL +
          "?mode=api" +
          "&action=check" +
          "&angel=" +
          encodeURIComponent(
            angel
          ) +
          "&callback=" +
          encodeURIComponent(
            callbackName
          );


        document.body.appendChild(
          script
        );

      }
    );

  }


  /*
  =========================================
  CLAIM STATUS CHECK
  =========================================
  */

  function checkSubmissionStatus(
    token
  ) {

    return new Promise(
      function(resolve, reject) {

        const callbackName =
          "givingTreeStatus_" +
          Date.now() +
          "_" +
          Math.floor(
            Math.random() * 100000
          );


        const script =
          document.createElement(
            "script"
          );


        const timeout =
          setTimeout(
            function() {

              cleanup();

              reject(
                new Error(
                  "Claim confirmation timed out."
                )
              );

            },
            10000
          );


        function cleanup() {

          clearTimeout(
            timeout
          );


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          try {

            delete window[
              callbackName
            ];

          }

          catch (error) {

            window[
              callbackName
            ] = undefined;

          }

        }


        window[
          callbackName
        ] =
          function(result) {

            cleanup();

            resolve(
              result
            );

          };


        script.onerror =
          function() {

            cleanup();

            reject(
              new Error(
                "Unable to confirm the claim."
              )
            );

          };


        script.src =
          API_URL +
          "?mode=api" +
          "&action=status" +
          "&token=" +
          encodeURIComponent(
            token
          ) +
          "&callback=" +
          encodeURIComponent(
            callbackName
          );


        document.body.appendChild(
          script
        );

      }
    );

  }


  function makeToken() {

    return (
      Date.now().toString(36) +
      "_" +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  async function waitForSubmission(
    token
  ) {

    for (
      let attempt = 0;
      attempt < 20;
      attempt++
    ) {

      const result =
        await checkSubmissionStatus(
          token
        );


      if (
        result.done
      ) {

        return result;

      }


      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            500
          );

        }
      );

    }


    throw new Error(
      "The claim was submitted, but confirmation took too long."
    );

  }


  async function submitClaim(
    claimData
  ) {

    const token =
      makeToken();


    const formData =
      new FormData();


    formData.append(
      "token",
      token
    );

    formData.append(
      "name",
      claimData.name
    );

    formData.append(
      "email",
      claimData.email
    );

    formData.append(
      "phone",
      claimData.phone
    );

    formData.append(
      "angels",
      JSON.stringify(
        claimData.angels
      )
    );


    fetch(
      API_URL,
      {
        method: "POST",
        mode: "no-cors",
        body: formData
      }
    );


    return await waitForSubmission(
      token
    );

  }


  async function stopScannerAndClose() {

    try {

      await scanner.stop();

    }

    catch (error) {

    }


    scannerBox.classList.remove(
      "active"
    );

  }


  async function processScannedAngel(
    angel
  ) {

    if (
      angels.includes(
        angel
      )
    ) {

      await stopScannerAndClose();


      status.textContent =
        angel +
        " is already in your list.";

      status.className =
        "error";

      return;

    }


    status.textContent =
      "Checking " +
      angel +
      " availability...";

    status.className = "";


    try {

      const result =
        await checkAvailability(
          angel
        );


      await stopScannerAndClose();


      if (
        !result.valid
      ) {

        status.textContent =
          result.message;

        status.className =
          "error";

        return;

      }


      if (
        !result.available
      ) {

        status.textContent =
          result.message;

        status.className =
          "error";

        return;

      }


      angels.push(
        angel
      );


      saveCart();

      displayCart();


      status.textContent =
        angel +
        " is available and has been added.";

      status.className =
        "success";

    }

    catch (error) {

      await stopScannerAndClose();


      status.textContent =
        "Unable to check this Angel. " +
        error.message;

      status.className =
        "error";

    }

  }


  const scanner =
    new QrScanner(

      video,

      async function(
        scanResult
      ) {

        if (
          scanBeingProcessed
        ) {

          return;

        }


        scanBeingProcessed =
          true;


        const angel =
          extractAngelCode(
            scanResult.data
          );


        if (!angel) {

          await stopScannerAndClose();


          status.textContent =
            "This is not a valid Giving Tree Angel QR code.";

          status.className =
            "error";


          scanBeingProcessed =
            false;

          return;

        }


        await processScannedAngel(
          angel
        );


        scanBeingProcessed =
          false;

      },

      {
        preferredCamera:
          "environment",

        highlightScanRegion:
          true,

        highlightCodeOutline:
          true,

        returnDetailedScanResult:
          true
      }

    );


  scanButton.addEventListener(
    "click",
    async function() {

      try {

        scanBeingProcessed =
          false;


        status.textContent =
          "Starting scanner...";

        status.className = "";


        scannerBox.classList.add(
          "active"
        );


        await scanner.start();


        status.textContent =
          "Camera ready. Scan an Angel QR.";

      }

      catch (error) {

        scannerBox.classList.remove(
          "active"
        );


        status.textContent =
          "Scanner error: " +
          error;

        status.className =
          "error";

      }

    }
  );


  cancelScanButton.addEventListener(
    "click",
    async function() {

      await stopScannerAndClose();


      scanBeingProcessed =
        false;


      status.textContent =
        "Scan cancelled.";

      status.className = "";

    }
  );


  completeButton.addEventListener(
    "click",
    function() {

      if (
        angels.length === 0
      ) {

        status.textContent =
          "Please scan at least one Angel.";

        status.className =
          "error";

        return;

      }


      displayReview();


      claimForm.style.display =
        "block";


      claimForm.scrollIntoView({
        behavior: "smooth"
      });


      status.textContent =
        "Please complete your sponsor information.";

      status.className = "";

    }
  );


  submitClaimButton.addEventListener(
    "click",
    async function() {

      const name =
        document
          .getElementById(
            "sponsorName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "sponsorEmail"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "sponsorPhone"
          )
          .value
          .trim();


      if (
        !name ||
        !email ||
        !phone
      ) {

        status.textContent =
          "Please complete your name, email address, and phone number.";

        status.className =
          "error";

        return;

      }


      submitClaimButton.disabled =
        true;

      completeButton.disabled =
        true;

      scanButton.disabled =
        true;


      status.textContent =
        "Submitting your claim...";

      status.className = "";


      try {

        const result =
          await submitClaim({
            name: name,
            email: email,
            phone: phone,
            angels: angels
          });


        if (
          !result.success
        ) {

          status.textContent =
            result.message;

          status.className =
            "error";


          submitClaimButton.disabled =
            false;

          completeButton.disabled =
            false;

          scanButton.disabled =
            false;

          return;

        }


        const count =
          result.count;


        clearCart();


        document
          .getElementById(
            "sponsorName"
          )
          .value = "";


        document
          .getElementById(
            "sponsorEmail"
          )
          .value = "";


        document
          .getElementById(
            "sponsorPhone"
          )
          .value = "";


        displayCart();

        displayReview();


        mainScreen.style.display =
          "none";


        successScreen.style.display =
          "block";


        successMessage.textContent =
          "You successfully claimed " +
          count +
          " Angel(s).";

      }

      catch (error) {

        status.textContent =
          error.message;

        status.className =
          "error";


        submitClaimButton.disabled =
          false;

        completeButton.disabled =
          false;

        scanButton.disabled =
          false;

      }

    }
  );


  startOverButton.addEventListener(
    "click",
    function() {

      clearCart();


      displayCart();

      displayReview();


      claimForm.style.display =
        "none";


      successScreen.style.display =
        "none";


      mainScreen.style.display =
        "block";


      status.textContent =
        "Ready to scan.";

      status.className = "";


      submitClaimButton.disabled =
        false;

      completeButton.disabled =
        false;

      scanButton.disabled =
        false;

    }
  );


  displayCart();

</script>

</body>
</html>
