<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Giving Tree Scanner Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.4;
    }

    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
      background: #000;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 14px;
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      border: 1px solid #aaa;
      background: white;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #f0f0f0;
      border-radius: 8px;
      word-break: break-word;
    }

    .success {
      background: #eef8ee;
    }

    .error {
      background: #fdecec;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Giving Tree Scanner Test</h1>

  <p>
    Tap Start Scanner, allow camera access,
    then point the back camera at an Angel QR code.
  </p>

  <button id="startButton">
    Start Scanner
  </button>

  <video id="qrVideo" playsinline></video>

  <div id="result">
    Scanner not started.
  </div>

</div>


<script type="module">

  import QrScanner
    from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const video =
    document.getElementById("qrVideo");

  const result =
    document.getElementById("result");

  const startButton =
    document.getElementById("startButton");


  function extractAngelCode(scannedText) {

    try {

      const url =
        new URL(scannedText);

      const params =
        new URLSearchParams(
          url.search
        );

      for (const value of params.values()) {

        if (
          /^Angel\d+$/i.test(value)
        ) {

          const digits =
            value.replace(/\D/g, "");

          return "Angel" +
            digits.padStart(3, "0");

        }
      }

    } catch (error) {

      if (
        /^Angel\d+$/i.test(
          scannedText
        )
      ) {

        const digits =
          scannedText.replace(/\D/g, "");

        return "Angel" +
          digits.padStart(3, "0");

      }
    }

    return "";
  }


  const scanner =
    new QrScanner(

      video,

      function(scanResult) {

        const angel =
          extractAngelCode(
            scanResult.data
          );


        scanner.stop();


        if (angel) {

          result.textContent =
            angel +
            " scanned successfully.";

          result.className =
            "success";

        } else {

          result.textContent =
            "This is not a valid Giving Tree Angel QR code.";

          result.className =
            "error";

        }

      },

      {
        preferredCamera:
          "environment",

        highlightScanRegion:
          true,

        highlightCodeOutline:
          true,

        returnDetailedScanResult:
          true
      }

    );


  startButton.addEventListener(
    "click",
    async function() {

      try {

        result.textContent =
          "Starting scanner...";

        result.className = "";


        await scanner.start();


        result.textContent =
          "Camera ready. Scan an Angel QR.";

      }

      catch(error) {

        result.textContent =
          "Scanner error: " +
          error;

        result.className =
          "error";

      }

    }
  );

</script>

</body>
</html>
