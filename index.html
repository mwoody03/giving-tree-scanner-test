<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Giving Tree</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-top: 0;
    }

    h2 {
      font-size: 22px;
      margin-top: 24px;
    }

    p {
      font-size: 18px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 14px;
      margin-top: 16px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      border: 1px solid #aaa;
      background: white;
      cursor: pointer;
    }

    .scanner-box {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 12px;
      background: #fafafa;
    }

    .scanner-box.active {
      display: block;
    }

    .scanner-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 10px;
      background: #000;
      min-height: 260px;
      object-fit: cover;
    }

    .scan-frame {
      position: relative;
    }

    .scan-guide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
    }

    .cancel-button {
      min-height: 48px;
      font-size: 17px;
    }

    .angel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }

    .remove-button {
      width: auto;
      min-height: 40px;
      margin: 0;
      padding: 8px 12px;
      font-size: 15px;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .success {
      background: #eef8ee !important;
    }

    .error {
      background: #fdecec !important;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Giving Tree</h1>

  <p>
    Scan each Angel you would like to sponsor.
  </p>

  <button id="scanButton">
    Scan Angel
  </button>

  <div id="scannerBox" class="scanner-box">

    <div class="scanner-title">
      Point the camera at the Angel QR code
    </div>

    <div class="scan-frame">
      <video id="qrVideo" playsinline></video>
      <div class="scan-guide"></div>
    </div>

    <button
      id="cancelScanButton"
      class="cancel-button">
      Cancel Scan
    </button>

  </div>

  <div id="status">
    Ready to scan.
  </div>

  <h2>Your Angels</h2>

  <div id="angelList"></div>

  <button id="completeButton">
    Complete Claim
  </button>

</div>


<script type="module">

  import QrScanner
    from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const video =
    document.getElementById("qrVideo");

  const status =
    document.getElementById("status");

  const scanButton =
    document.getElementById("scanButton");

  const cancelScanButton =
    document.getElementById("cancelScanButton");

  const scannerBox =
    document.getElementById("scannerBox");

  const completeButton =
    document.getElementById("completeButton");

  const angelList =
    document.getElementById("angelList");


  let angels =
    JSON.parse(
      localStorage.getItem("givingTreeCart") || "[]"
    );


  function saveCart() {

    localStorage.setItem(
      "givingTreeCart",
      JSON.stringify(angels)
    );

  }


  function extractAngelCode(scannedText) {

    try {

      const url =
        new URL(scannedText);

      const params =
        new URLSearchParams(
          url.search
        );

      for (const value of params.values()) {

        if (
          /^Angel\d+$/i.test(value)
        ) {

          const digits =
            value.replace(/\D/g, "");

          return "Angel" +
            digits.padStart(3, "0");

        }
      }

    } catch (error) {

      if (
        /^Angel\d+$/i.test(scannedText)
      ) {

        const digits =
          scannedText.replace(/\D/g, "");

        return "Angel" +
          digits.padStart(3, "0");

      }
    }

    return "";
  }


  function displayCart() {

    angelList.innerHTML = "";

    if (angels.length === 0) {

      angelList.innerHTML =
        "<p>No Angels selected yet.</p>";

      return;
    }


    angels.forEach(function(angel) {

      const row =
        document.createElement("div");

      row.className =
        "angel-row";


      const label =
        document.createElement("span");

      label.textContent =
        "✓ " + angel;


      const removeButton =
        document.createElement("button");

      removeButton.textContent =
        "Remove";

      removeButton.className =
        "remove-button";


      removeButton.addEventListener(
        "click",
        function() {

          angels =
            angels.filter(
              function(item) {
                return item !== angel;
              }
            );

          saveCart();
          displayCart();

        }
      );


      row.appendChild(label);
      row.appendChild(removeButton);

      angelList.appendChild(row);

    });

  }


  async function stopScannerAndClose() {

    try {

      await scanner.stop();

    } catch (error) {

      // Scanner may already be stopped.

    }

    scannerBox.classList.remove(
      "active"
    );

  }


  const scanner =
    new QrScanner(

      video,

      async function(scanResult) {

        const angel =
          extractAngelCode(
            scanResult.data
          );


        if (!angel) {

          status.textContent =
            "This is not a valid Giving Tree Angel QR code.";

          status.className =
            "error";

          return;

        }


        await stopScannerAndClose();


        if (
          angels.includes(angel)
        ) {

          status.textContent =
            angel +
            " is already in your list.";

          status.className =
            "error";

          return;

        }


        angels.push(
          angel
        );

        saveCart();
        displayCart();


        status.textContent =
          angel +
          " added successfully.";

        status.className =
          "success";

      },

      {
        preferredCamera:
          "environment",

        highlightScanRegion:
          true,

        highlightCodeOutline:
          true,

        returnDetailedScanResult:
          true
      }

    );


  scanButton.addEventListener(
    "click",
    async function() {

      try {

        status.textContent =
          "Starting scanner...";

        status.className = "";

        scannerBox.classList.add(
          "active"
        );


        await scanner.start();


        status.textContent =
          "Camera ready. Scan an Angel QR.";

      }

      catch(error) {

        scannerBox.classList.remove(
          "active"
        );

        status.textContent =
          "Scanner error: " +
          error;

        status.className =
          "error";

      }

    }
  );


  cancelScanButton.addEventListener(
    "click",
    async function() {

      await stopScannerAndClose();

      status.textContent =
        "Scan cancelled.";

      status.className = "";

    }
  );


  completeButton.addEventListener(
    "click",
    function() {

      if (
        angels.length === 0
      ) {

        status.textContent =
          "Please scan at least one Angel.";

        status.className =
          "error";

        return;

      }


      status.textContent =
        "You currently have " +
        angels.length +
        " Angel(s) selected.";

      status.className =
        "success";

    }
  );


  displayCart();

</script>

</body>
</html>
