<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Giving Tree</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

.card {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 30px;
}

h2 {
  font-size: 22px;
  margin-top: 24px;
}

p {
  font-size: 18px;
  line-height: 1.4;
}

button {
  width: 100%;
  min-height: 58px;
  padding: 14px;
  margin-top: 16px;
  font-size: 20px;
  font-weight: bold;
  border-radius: 10px;
  border: 1px solid #aaa;
  background: white;
}

button:disabled {
  opacity: .6;
}

.scanner-box {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border: 2px solid #ccc;
  border-radius: 12px;
}

.scanner-box.active {
  display: block;
}

.scan-frame {
  position: relative;
}

video {
  width: 100%;
  min-height: 260px;
  object-fit: cover;
  background: black;
  border-radius: 10px;
}

.scan-guide {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 70%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  border-radius: 12px;
  pointer-events: none;
}

.angel-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #ddd;
  font-size: 20px;
  font-weight: bold;
}

.remove-button {
  width: auto;
  min-height: 40px;
  margin: 0;
  padding: 8px 12px;
  font-size: 15px;
}

.claim-form {
  display: none;
  margin-top: 24px;
  border-top: 2px solid #ddd;
  padding-top: 20px;
}

label {
  display: block;
  margin-top: 16px;
  font-size: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  min-height: 52px;
  padding: 14px;
  margin-top: 7px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

.review-item {
  font-size: 19px;
  padding: 8px 0;
}

#status {
  margin-top: 16px;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  border-radius: 8px;
  background: #f0f0f0;
  line-height: 1.4;
}

.success {
  background: #eef8ee !important;
}

.error {
  background: #fdecec !important;
}

.success-screen {
  display: none;
  text-align: center;
  padding: 20px 0;
}

</style>

</head>


<body>


<div class="card">


<div id="mainScreen">


<h1>Giving Tree</h1>

<p>
Scan each Angel you would like to sponsor.
</p>


<button id="scanButton">
Scan Angel
</button>


<div
  id="scannerBox"
  class="scanner-box">

<p>
Point the camera at the Angel QR code.
</p>


<div class="scan-frame">

<video
  id="qrVideo"
  playsinline>
</video>

<div class="scan-guide"></div>

</div>


<button id="cancelScanButton">
Cancel Scan
</button>

</div>


<div id="status">
Ready to scan.
</div>


<h2>Your Angels</h2>

<div id="angelList"></div>


<button id="completeButton">
Complete Claim
</button>


<div
  id="claimForm"
  class="claim-form">


<h2>Sponsor Information</h2>


<label>
Full Name
</label>

<input
  id="sponsorName"
  type="text"
  autocomplete="name"
>


<label>
Email Address
</label>

<input
  id="sponsorEmail"
  type="email"
  autocomplete="email"
>


<label>
Phone Number
</label>

<input
  id="sponsorPhone"
  type="tel"
  autocomplete="tel"
>


<h2>Review Your Angels</h2>

<div id="reviewList"></div>


<button id="submitClaimButton">
Claim My Angels
</button>


</div>

</div>



<div
  id="successScreen"
  class="success-screen">

<h2>Claim Complete</h2>

<p id="successMessage"></p>

<p>
Thank you for supporting the Giving Tree.
</p>

<button id="startOverButton">
Start New Claim
</button>

</div>


</div>



<script type="module">


import QrScanner
from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


const API_URL =
"https://script.google.com/macros/s/AKfycbxZp0fNOC7QPDzvOrWCezJl8jKH0ZrSHGnmnEfnnuu44Sr8HrN9NFa-EZlz4GRrQVOF/exec";


const video =
document.getElementById("qrVideo");

const status =
document.getElementById("status");

const scannerBox =
document.getElementById("scannerBox");

const scanButton =
document.getElementById("scanButton");

const cancelScanButton =
document.getElementById("cancelScanButton");

const angelList =
document.getElementById("angelList");

const completeButton =
document.getElementById("completeButton");

const claimForm =
document.getElementById("claimForm");

const reviewList =
document.getElementById("reviewList");

const submitClaimButton =
document.getElementById("submitClaimButton");

const mainScreen =
document.getElementById("mainScreen");

const successScreen =
document.getElementById("successScreen");

const successMessage =
document.getElementById("successMessage");

const startOverButton =
document.getElementById("startOverButton");


let angels =
JSON.parse(
  localStorage.getItem(
    "givingTreeCart"
  ) || "[]"
);


let scanBeingProcessed =
false;



function saveCart() {

  localStorage.setItem(
    "givingTreeCart",
    JSON.stringify(angels)
  );

}



function clearCart() {

  localStorage.removeItem(
    "givingTreeCart"
  );

  angels = [];

}



function extractAngelCode(
  scannedText
) {

  try {

    const url =
    new URL(scannedText);


    for (
      const value
      of url.searchParams.values()
    ) {

      if (
        /^Angel\d+$/i.test(
          value
        )
      ) {

        const digits =
        value.replace(
          /\D/g,
          ""
        );


        return "Angel" +
        digits.padStart(
          3,
          "0"
        );

      }

    }

  }

  catch (error) {

  }


  return "";

}



function displayCart() {

  angelList.innerHTML =
  "";


  if (
    angels.length === 0
  ) {

    angelList.innerHTML =
    "<p>No Angels selected yet.</p>";

    return;

  }


  angels.forEach(
    function(angel) {

      const row =
      document.createElement(
        "div"
      );


      row.className =
      "angel-row";


      const label =
      document.createElement(
        "span"
      );


      label.textContent =
      "✓ " + angel;


      const button =
      document.createElement(
        "button"
      );


      button.textContent =
      "Remove";


      button.className =
      "remove-button";


      button.onclick =
      function() {

        angels =
        angels.filter(
          item =>
          item !== angel
        );


        saveCart();

        displayCart();

        displayReview();

      };


      row.appendChild(
        label
      );


      row.appendChild(
        button
      );


      angelList.appendChild(
        row
      );

    }
  );

}



function displayReview() {

  reviewList.innerHTML =
  "";


  angels.forEach(
    function(angel) {

      const div =
      document.createElement(
        "div"
      );


      div.className =
      "review-item";


      div.textContent =
      "✓ " + angel;


      reviewList.appendChild(
        div
      );

    }
  );

}



function jsonpOnce(
  action,
  values
) {

  return new Promise(
    function(resolve, reject) {

      const callback =
      "gt_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() *
        1000000
      );


      const script =
      document.createElement(
        "script"
      );


      const timeout =
      setTimeout(
        function() {

          cleanup();

          reject(
            new Error(
              "The Giving Tree database did not respond."
            )
          );

        },
        30000
      );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.remove();

        }


        try {

          delete window[
            callback
          ];

        }

        catch (error) {

        }

      }


      window[
        callback
      ] =
      function(result) {

        cleanup();

        resolve(result);

      };


      script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "The Giving Tree database could not be reached."
          )
        );

      };


      const params =
      new URLSearchParams();


      params.set(
        "mode",
        "api"
      );


      params.set(
        "action",
        action
      );


      Object.keys(
        values
      ).forEach(
        function(key) {

          params.set(
            key,
            values[key]
          );

        }
      );


      params.set(
        "callback",
        callback
      );


      script.src =
      API_URL +
      "?" +
      params.toString();


      document.body.appendChild(
        script
      );

    }
  );

}



async function jsonpWithRetry(
  action,
  values
) {

  try {

    return await jsonpOnce(
      action,
      values
    );

  }

  catch (firstError) {

    status.textContent =
    "Still checking. Please wait...";


    await new Promise(
      resolve =>
      setTimeout(
        resolve,
        1000
      )
    );


    return await jsonpOnce(
      action,
      values
    );

  }

}



async function stopScanner() {

  try {

    await scanner.stop();

  }

  catch (error) {

  }


  scannerBox.classList.remove(
    "active"
  );

}



async function checkAngel(
  angel
) {

  return await jsonpWithRetry(
    "check",
    {
      angel: angel
    }
  );

}



async function handleScannedAngel(
  angel
) {

  if (
    angels.includes(
      angel
    )
  ) {

    await stopScanner();


    status.textContent =
    angel +
    " is already in your list.";


    status.className =
    "error";


    return;

  }


  status.textContent =
  "Checking " +
  angel +
  "...";


  try {

    const result =
    await checkAngel(
      angel
    );


    await stopScanner();


    if (
      !result.valid ||
      !result.available
    ) {

      status.textContent =
      result.message;


      status.className =
      "error";


      return;

    }


    angels.push(
      angel
    );


    saveCart();

    displayCart();


    status.textContent =
    angel +
    " added successfully.";


    status.className =
    "success";

  }

  catch (error) {

    await stopScanner();


    status.textContent =
    "Unable to check this Angel. " +
    error.message;


    status.className =
    "error";

  }

}



const scanner =
new QrScanner(

  video,

  async function(result) {

    if (
      scanBeingProcessed
    ) {

      return;

    }


    scanBeingProcessed =
    true;


    const angel =
    extractAngelCode(
      result.data
    );


    if (!angel) {

      await stopScanner();


      status.textContent =
      "This is not a valid Giving Tree QR code.";


      status.className =
      "error";


      scanBeingProcessed =
      false;


      return;

    }


    await handleScannedAngel(
      angel
    );


    scanBeingProcessed =
    false;

  },


  {

    preferredCamera:
    "environment",

    highlightScanRegion:
    true,

    highlightCodeOutline:
    true,

    returnDetailedScanResult:
    true

  }

);



scanButton.onclick =
async function() {

  scannerBox.classList.add(
    "active"
  );


  status.textContent =
  "Starting scanner...";


  status.className =
  "";


  scanBeingProcessed =
  false;


  try {

    await scanner.start();


    status.textContent =
    "Camera ready.";

  }

  catch (error) {

    scannerBox.classList.remove(
      "active"
    );


    status.textContent =
    "Camera could not start.";


    status.className =
    "error";

  }

};



cancelScanButton.onclick =
async function() {

  await stopScanner();


  status.textContent =
  "Scan cancelled.";

};



completeButton.onclick =
function() {

  if (
    angels.length === 0
  ) {

    status.textContent =
    "Please scan at least one Angel.";


    status.className =
    "error";


    return;

  }


  displayReview();


  claimForm.style.display =
  "block";


  claimForm.scrollIntoView({
    behavior:
    "smooth"
  });


  status.textContent =
  "Please complete your sponsor information.";


  status.className =
  "";

};



function createToken() {

  return (
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2)
  );

}



function postClaim(
  claimData,
  token
) {

  const iframeName =
  "claimFrame_" +
  Date.now();


  const iframe =
  document.createElement(
    "iframe"
  );


  iframe.name =
  iframeName;


  iframe.style.display =
  "none";


  document.body.appendChild(
    iframe
  );


  const form =
  document.createElement(
    "form"
  );


  form.method =
  "POST";


  form.action =
  API_URL;


  form.target =
  iframeName;


  form.style.display =
  "none";


  const fields = {

    token:
    token,

    name:
    claimData.name,

    email:
    claimData.email,

    phone:
    claimData.phone,

    angels:
    JSON.stringify(
      claimData.angels
    )

  };


  Object.keys(
    fields
  ).forEach(
    function(key) {

      const input =
      document.createElement(
        "input"
      );


      input.type =
      "hidden";


      input.name =
      key;


      input.value =
      fields[key];


      form.appendChild(
        input
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  setTimeout(
    function() {

      form.remove();

    },
    2000
  );


  setTimeout(
    function() {

      iframe.remove();

    },
    60000
  );

}



async function waitForClaim(
  token
) {

  for (
    let attempt = 0;
    attempt < 30;
    attempt++
  ) {

    try {

      const result =
      await jsonpWithRetry(
        "status",
        {
          token: token
        }
      );


      if (
        result.done
      ) {

        return result;

      }

    }

    catch (error) {

    }


    await new Promise(
      resolve =>
      setTimeout(
        resolve,
        1000
      )
    );

  }


  throw new Error(
    "The claim was sent, but confirmation is taking longer than expected."
  );

}



submitClaimButton.onclick =
async function() {

  const name =
  document
    .getElementById(
      "sponsorName"
    )
    .value
    .trim();


  const email =
  document
    .getElementById(
      "sponsorEmail"
    )
    .value
    .trim();


  const phone =
  document
    .getElementById(
      "sponsorPhone"
    )
    .value
    .trim();


  if (
    !name ||
    !email ||
    !phone
  ) {

    status.textContent =
    "Please complete all sponsor information.";


    status.className =
    "error";


    return;

  }


  submitClaimButton.disabled =
  true;


  scanButton.disabled =
  true;


  completeButton.disabled =
  true;


  status.textContent =
  "Submitting your claim. Please wait...";


  status.className =
  "";


  const token =
  createToken();


  postClaim(
    {
      name:
      name,

      email:
      email,

      phone:
      phone,

      angels:
      angels
    },

    token
  );


  try {

    const result =
    await waitForClaim(
      token
    );


    if (
      !result.success
    ) {

      status.textContent =
      result.message;


      status.className =
      "error";


      submitClaimButton.disabled =
      false;


      scanButton.disabled =
      false;


      completeButton.disabled =
      false;


      return;

    }


    const count =
    result.count;


    clearCart();


    displayCart();


    mainScreen.style.display =
    "none";


    successScreen.style.display =
    "block";


    successMessage.textContent =
    "You successfully claimed " +
    count +
    " Angel(s).";

  }

  catch (error) {

    status.textContent =
    error.message;


    status.className =
    "error";


    submitClaimButton.disabled =
    false;


    scanButton.disabled =
    false;


    completeButton.disabled =
    false;

  }

};



startOverButton.onclick =
function() {

  clearCart();

  displayCart();


  claimForm.style.display =
  "none";


  mainScreen.style.display =
  "block";


  successScreen.style.display =
  "none";


  status.textContent =
  "Ready to scan.";


  status.className =
  "";


  submitClaimButton.disabled =
  false;


  scanButton.disabled =
  false;


  completeButton.disabled =
  false;

};



displayCart();


</script>


</body>

</html>
