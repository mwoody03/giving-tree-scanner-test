<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Giving Tree Scanner Test</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #ddd;
    }

    h1 {
      text-align: center;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      border: 1px solid #aaa;
      background: white;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      background: #f0f0f0;
      border-radius: 8px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Giving Tree Scanner Test</h1>

  <p>
    Tap the button below, allow camera access,
    then point the back camera at an Angel QR code.
  </p>

  <button id="startButton">
    Start QR Scanner
  </button>

  <div id="reader"></div>

  <div id="result">
    Scanner not started.
  </div>

</div>


<script>

  const qrScanner =
    new Html5Qrcode("reader");


  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      function() {

        const result =
          document.getElementById("result");


        result.textContent =
          "Starting back camera...";


        qrScanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const size =
                Math.floor(
                  Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                  ) * 0.75
                );

              return {
                width: size,
                height: size
              };
            },

            experimentalFeatures: {
              useBarCodeDetectorIfSupported: false
            }
          },


          function(decodedText) {

            result.textContent =
              "QR READ SUCCESSFULLY:\n\n" +
              decodedText;


            qrScanner
              .stop()
              .catch(function() {});

          },


          function(errorMessage) {

            // Ignore normal scanning misses.

          }

        )

        .catch(
          function(error) {

            result.textContent =
              "Camera error: " +
              error;

          }
        );

      }
    );

</script>

</body>
</html>
